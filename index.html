<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget App</title>
  
  <!-- PWA Meta Tags for iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BudgetApp">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header / Month Selector -->
    <header class="header">
      <div class="month-selector">
        <h1>August 2026</h1>
        <span class="chevron">⌄</span>
      </div>
    </header>

    <!-- Left to Budget Banner -->
    <div class="budget-left-banner">
      <span><strong id="left-to-budget">$0.00</strong> left to budget</span>
    </div>

    <!-- Income Section Card -->
    <section class="card">
      <div class="card-header">
        <h2>Income</h2>
        <div class="column-headers">
          <span>Planned</span>
          <span>Remaining</span>
        </div>
      </div>

      <div class="card-body" id="income-list">
        <!-- Rows will be injected here via JavaScript -->
      </div>

      <div class="card-footer">
        <button id="add-income-btn" class="add-link-btn">+ Add Income</button>
        <div class="totals">
          <span class="planned"><strong id="income-planned-total">$0.00</strong></span>
          <span class="remaining"><strong id="income-remaining-total">$0.00</strong></span>
        </div>
      </div>
    </section>

    <!-- Favorites Section Card -->
    <section class="card">
      <div class="card-header">
        <h2>Favorites</h2>
        <div class="column-headers">
          <span>Planned</span>
          <span>Remaining</span>
        </div>
      </div>

      <div class="card-body" id="favorites-list">
        <!-- Favorite items will dynamically appear here -->
      </div>
    </section>
  </div>

  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
